name: Publish approved posts

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may start runs a few minutes late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841433803144402"   # artiveew Instagram account ID (not secret)
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/publish.py
      - name: Record published posts
        if: always()
        run: |
          git config user.name "artiveew-bot"
          git config user.email "artiveew-bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "Mark published posts" && git push)
